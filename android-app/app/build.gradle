plugins { id 'com.android.application' }
android {
    namespace 'app.netlify.franmotest'
    compileSdk 36
    defaultConfig {
        applicationId 'app.netlify.franmotest'
        minSdk 23
        targetSdk 36
        versionCode = (project.findProperty('qaVersionCode') ?: '4').toString().toInteger()
        versionName = (project.findProperty('qaVersionName') ?: '1.1.1').toString()
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // 1.15 supports Android 6; the WebView engine is system managed.
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
}
