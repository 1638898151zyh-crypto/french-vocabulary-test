plugins { id 'com.android.application' }
android {
    namespace 'app.netlify.franmotest'
    compileSdk 36
    defaultConfig {
        applicationId 'app.netlify.franmotest'
        minSdk 23
        targetSdk 36
        versionCode = (project.findProperty('qaVersionCode') ?: '9').toString().toInteger()
        versionName = (project.findProperty('qaVersionName') ?: '1.1.6').toString()
        def migrated = System.getenv('FRANMOTEST_BACKEND') == 'supabase'
        def apiHost = migrated ? new URI(System.getenv('VITE_SITE_URL')).host : 'franmotest.netlify.app'
        def authHost = migrated ? new URI(System.getenv('VITE_SUPABASE_URL')).host : 'franmotest.netlify.app'
        if (!(apiHost ==~ /[a-z0-9.-]+/) || !(authHost ==~ /[a-z0-9.-]+/)) throw new GradleException('Invalid backend host')
        buildConfigField 'boolean', 'MIGRATED_BACKEND', migrated.toString()
        buildConfigField 'String', 'API_HOST', '"' + apiHost + '"'
        buildConfigField 'String', 'AUTH_HOST', '"' + authHost + '"'
        manifestPlaceholders.appLinkHost = apiHost
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // 1.15 supports Android 6; the WebView engine is system managed.
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
}
