<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>每日单词检测 · Édito B1</title><style>
    :root{color-scheme:light;--bg:#fff;--ink:#202124;--muted:#777b80;--line:#eeeef0;--pale:#f5f6f7;--green:#139950;--red:#ce454b;--disabled:#bfc3c6;--disabled-border:#e8eaec;font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{cursor:default}button:focus-visible{outline:2px solid #438ac7;outline-offset:3px}button,section{touch-action:manipulation}.app{max-width:700px;margin:0 auto;padding:18px 20px 16px}h1{font-size:22px;line-height:1.3;margin:0 0 5px;font-weight:750;letter-spacing:-.35px}.source{font-size:12px;color:var(--muted);margin:0}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:15px}.round{font-size:14px;font-weight:700}.badge{font-size:11px;font-weight:600;background:#eaf2fa;color:#427cae;padding:3px 8px;border-radius:20px}.summary{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:6px 0 7px}.result{color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}.result .green{color:var(--green)}.result .red{color:var(--red);margin-left:9px}progress{display:block;width:100%;height:3px;border:0;border-radius:5px;overflow:hidden;appearance:none}progress::-webkit-progress-bar{background:var(--line)}progress::-webkit-progress-value{background:var(--ink)}progress::-moz-progress-bar{background:var(--ink)}.tabs{display:flex;gap:5px;margin:12px 0 0}.tab{flex:1;border:1px solid var(--disabled-border);color:var(--muted);background:var(--bg);padding:5px 0;border-radius:20px;font-size:12px}.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}.list{margin-top:5px}.entry{padding:11px 0 10px;border-bottom:1px solid var(--line)}.word{border:0;display:block;width:100%;background:transparent;color:var(--ink);padding:0;text-align:left;font-size:20px;line-height:1.38;overflow-wrap:anywhere}.number,.french{font-weight:750}.ipa{font-weight:400;font-size:11px;color:var(--muted);margin-left:7px;vertical-align:baseline}.hidden-answer{visibility:hidden;pointer-events:none}.bottomline{display:flex;align-items:flex-start;gap:11px;margin-top:5px}.marks{flex:none;display:flex;gap:5px;padding-top:1px}.mark{min-width:32px;min-height:22px;border:1px solid currentColor;border-radius:5px;background:transparent;padding:1px 4px;display:inline-flex;justify-content:center;align-items:center;gap:2px;line-height:16px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}.mark.good{color:var(--green)}.mark.bad{color:var(--red)}.mark.good.selected{background:var(--green);border-color:var(--green);color:#fff}.mark.bad.selected{background:var(--red);border-color:var(--red);color:#fff}.entry.closed .mark,.mark:disabled:not(.selected){color:var(--disabled);border-color:var(--disabled-border);background:transparent}.entry.open.rated .mark.good:not(.selected){color:var(--green);border-color:var(--green)}.entry.open.rated .mark.bad:not(.selected){color:var(--red);border-color:var(--red)}.count{min-width:9px;text-align:center}.translation{margin:0;font-size:18px;line-height:1.5;overflow-wrap:anywhere;flex:1;min-width:0}.pager{display:flex;align-items:center;justify-content:space-between;margin-top:13px;font-size:12px;color:var(--muted)}.nav{border:1px solid var(--disabled-border);border-radius:20px;color:var(--ink);background:var(--bg);font-size:12px;padding:6px 13px}.nav.next{background:var(--ink);color:var(--bg);border-color:var(--ink)}.nav:disabled{opacity:.35}.actions{display:flex;gap:7px;margin-top:12px}.action{flex:1;border:1px solid var(--disabled-border);background:var(--bg);color:var(--ink);border-radius:8px;font-size:12px;padding:8px 4px}.action.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}.hint{font-size:11px;line-height:1.6;color:var(--muted);margin:10px 0 0}.storage-note{margin-top:5px;font-size:11px;color:var(--muted)}.storage-note.warning{color:var(--red)}.toast{min-height:17px;margin:5px 0 0;font-size:11px;color:var(--muted)}
    .part-heading{display:flex;align-items:baseline;gap:8px;margin:7px 0 0;padding:6px 8px;background:var(--pale);border-radius:6px;font-size:13px;font-weight:650;line-height:1.4}.part-label{flex:none;font-size:10.5px;font-weight:600;color:var(--muted)}.part-name{min-width:0;overflow-wrap:anywhere}
    @media(max-width:480px){.app{padding:14px 12px 12px}.word{font-size:19px}.translation{font-size:17px}.entry{padding:10px 0 9px}.bottomline{gap:9px}h1{font-size:21px}}
    @media(prefers-reduced-motion:no-preference){.mark{transition:background-color .1s,color .1s}.tab{transition:background-color .1s}}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#191b1e;--ink:#f0f0f1;--muted:#a0a3a7;--line:#303338;--pale:#26292e;--green:#39be78;--red:#ed747a;--disabled:#666b72;--disabled-border:#373b42}.badge{background:#263c51;color:#acd0f3}.mark.good.selected{background:#198851;border-color:#198851}.mark.bad.selected{background:#be4148;border-color:#be4148}}
  .theme-heading{font-size:16px;font-weight:650;margin:7px 0;color:var(--ink)}.main-progress{font-size:12px;color:var(--muted);line-height:1.7}.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.empty{padding:28px 10px;background:var(--pale);border-radius:8px;line-height:1.8;font-size:14px}.part-heading{display:block;padding:9px 10px;margin:9px 0 10px}.part-label{display:block;font-size:12px;margin-bottom:5px}.part-name{display:block;font-size:18px;line-height:1.4;font-weight:650}.part-zh{display:block;font-size:15px;line-height:1.5;font-weight:400;margin-top:3px;color:var(--muted)}.theme-heading{margin:10px 0 7px;font-size:17px;line-height:1.4;font-weight:650}.theme-label{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-bottom:3px}.theme-name{display:block;overflow-wrap:anywhere}.theme-zh{display:block;font-size:14px;line-height:1.5;font-weight:400;margin-top:3px;color:var(--muted)}</style></head><body>
<main class="app"><h1>每日单词检测</h1><p class="source">Édito B1 · 法语 → 中文 · 仅复习已过关内容</p>
<p class="main-progress" id="main-progress"></p><div class="topline"><span class="round" id="round-label"></span><span class="badge">副进度 · 5 组 × 10 词</span></div>
<div class="summary"><span id="progress-label"></span><span class="result" id="result"></span></div><progress id="progress" max="50" value="0" aria-label="每日检测进度"></progress>
<nav class="tabs" role="tablist" aria-label="每日词汇分组"></nav><section class="list" id="word-list" role="tabpanel"></section>
<div class="pager"><button class="nav" id="previous">← 上一组</button><span id="page-number"></span><button class="nav next" id="next">下一组 →</button></div>
<div class="actions"><button class="action" id="repeat">再测本轮</button><button class="action primary" id="refresh">更新今日词汇</button></div>
<div class="tools"><button class="nav" id="import">导入课本主进度</button><input type="file" id="import-file" accept="application/json,.json" hidden><button class="nav" id="export">导出每日记录</button></div>
<p class="hint">第1、2组：最近过关的 Part；第3组：倒数第2个；第4组：倒数第3个；第5组：其余已过关 Part 随机选一个。每组只抽该 Part 的一个主题，每次打开重新抽词。</p>
<p class="hint">点词翻开中文和音标，✔／✘ 随时改选，每词每轮只计最终选择一次。每日检测不会把课本 Part 标为过关。</p>
<p class="storage-note" id="storage-note"></p><p class="toast" id="toast" role="status" aria-live="polite"></p></main>
<script id="vocabulary-data" type="application/json">__TEXTBOOK_BANK__</script><script>__TEXTBOOK_CORE__</script><script>__DAILY_CORE__</script><script>
(() => {
'use strict';
const bank=JSON.parse(document.getElementById('vocabulary-data').textContent),dictionary=new Map(bank.map(e=>[e.id,e])),Core=DailyCore,titles=__DAILY_TITLES__;
const $=s=>document.querySelector(s),html=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=()=>new Intl.DateTimeFormat('sv-SE',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
let state=null,stored=null,imported=null,allowed=[],launchId=null,source='此浏览器课本记录',storageError=false;
try{stored=JSON.parse(localStorage.getItem(Core.DAILY_KEY)||'null');imported=stored?.importedMain||null;}catch{storageError=true;}
function notice(t){$('#toast').textContent=t;}
function main(){try{const raw=localStorage.getItem(Core.MAIN_KEY);source=raw?'此浏览器课本记录':imported?'导入的主进度副本':'尚未找到主进度';return raw||imported;}catch{source=imported?'导入的主进度副本':'尚未找到主进度';return imported;}}
function save(){try{localStorage.setItem(Core.DAILY_KEY,JSON.stringify({state,importedMain:imported}));storageError=false;}catch{storageError=true;}$('#storage-note').textContent=storageError?'此环境不能保存；请导出每日记录。':'副进度独立保存在此浏览器。跨设备需导入课本导出的主进度；导入仅用于每日检测。';}
function start(id=crypto.randomUUID(),force=false){
 allowed=Core.eligible(main(),bank);const previous=state||stored?.state;
 if(!force&&(previous?.openerId||previous?.launchId)===id&&previous.day===day()&&Core.validRound(previous,bank,allowed))state=previous;
 else state=Core.create(bank,allowed,id,day(),previous);
 if(state)state.openerId=force?(previous?.openerId||previous?.launchId||id):id;launchId=id;render();save();
}
function guard(){const next=Core.eligible(main(),bank);if(next.join('|')!==allowed.join('|')||state&&state.day!==day()||state&&!Core.validRound(state,bank,next)){start(crypto.randomUUID(),true);notice('已按最新主进度更新每日内容。');return false;}return !!state;}
    function renderRow(id, number) {
      const entry = dictionary.get(id), open = !!state.opened[id], rated = !!state.votes[id], counts = state.stats[id] || {good:0,bad:0};
      const visible = !!state.votes[id];
      return `<article class="entry ${open ? 'open' : 'closed'} ${rated ? 'rated' : ''}" data-id="${html(id)}">
        <button class="word" aria-label="${html(number + '. ' + entry.fr)}" aria-expanded="${open}" aria-controls="answer-${html(id)}"><span class="number">${number}.</span> <span class="french" lang="fr">${html(entry.fr)}</span><span class="ipa ${open ? '' : 'hidden-answer'}" aria-hidden="${!open}">${html(entry.ipa)}</span></button>
        <div class="bottomline"><div class="marks">${['good','bad'].map(kind => `<button class="mark ${kind} ${open && state.votes[id] === kind ? 'selected' : ''}" data-vote="${kind}" ${!open ? 'disabled' : ''} aria-label="${kind === 'good' ? '正确' : '错误'}${visible ? '，累计 ' + counts[kind] + ' 次' : ''}" aria-pressed="${state.votes[id] === kind}" title="${!open ? '先点击单词翻开答案' : state.votes[id] === kind ? '已选择' : (rated ? '改为' : '') + (kind === 'good' ? '正确' : '错误')}"><span aria-hidden="true">${kind === 'good' ? '✔' : '✘'}</span><span class="count ${visible ? '' : 'hidden-answer'}" aria-hidden="${!visible}">${counts[kind]}</span></button>`).join('')}</div><p class="translation ${open ? '' : 'hidden-answer'}" id="answer-${html(id)}" aria-hidden="${!open}">${html(entry.zh)}</p></div>
      </article>`;
    }
function render(){
 $('#main-progress').textContent=`主进度：已过关 ${allowed.length}/24 个 Part${allowed.length?' · 最近 '+allowed.at(-1):''} · ${source}`;
 $('#round-label').textContent=state?`${state.day} · 第 ${state.round} 轮`:'等待主进度';
 for(const id of ['repeat','export','previous','next'])$('#'+id).disabled=!state;
 $('.pager').hidden=!state;$('.tabs').hidden=!state;
 if(!state){$('#word-list').innerHTML='<div class="empty">'+(launchId?html(Core.problem(bank,allowed)||'主题词汇不足，暂不能生成完整五组。'):'正在读取课本主进度…')+'</div>';$('#progress-label').textContent='已判 0/50';$('#progress').value=0;$('#result').textContent='';return;}
 const t=Core.totals(state);$('#progress-label').textContent=`已翻 ${t.opened}/50 · 已判 ${t.done}/50`;$('#progress').value=t.done;$('#result').innerHTML=`<span class="green">✔ ${t.good}</span><span class="red">✘ ${t.bad}</span>`;
 $('.tabs').innerHTML=state.parts.map((p,i)=>`<button class="tab" id="tab-${i}" role="tab" aria-controls="word-list" data-group="${i}" aria-selected="${i===state.group}" tabindex="${i===state.group?0:-1}" title="${html(p+' · '+state.themes[i])}">第 ${i+1} 组</button>`).join('');
 $('#word-list').setAttribute('aria-labelledby',`tab-${state.group}`);const ids=state.ids.slice(state.group*10,state.group*10+10),e=dictionary.get(ids[0]);
 const labels=['最近过关','最近过关','倒数第2 Part','倒数第3 Part','其他已过关 Part'];
 $('#word-list').innerHTML=`<h2 class="part-heading"><span class="part-label">${labels[state.group]} · ${state.parts[state.group]}</span><span class="part-name" lang="fr">${html(e.partie_title)}</span><span class="part-zh" lang="zh-CN">${html(titles.parts[state.parts[state.group]].zh)}</span></h2><h3 class="theme-heading"><span class="theme-label">主题</span><span class="theme-name" lang="fr">${html(state.themes[state.group])}</span><span class="theme-zh" lang="zh-CN">${html(titles.themes[state.themes[state.group]])}</span></h3>`+ids.map((id,i)=>renderRow(id,i+1)).join('');
 $('#page-number').textContent=`${state.group+1} / 5`;$('#previous').disabled=state.group===0;$('#next').disabled=state.group===4;
}
function group(i){if(!guard()||i<0||i>4)return;state.group=i;render();save();}
$('#word-list').onclick=e=>{const b=e.target.closest('button'),r=b?.closest('.entry');if(!r||!guard())return;const id=r.dataset.id;const changed=b.dataset.vote?Core.vote(state,id,b.dataset.vote):Core.toggle(state,id);if(!changed)return;const number=state.ids.indexOf(id)%10+1;r.outerHTML=renderRow(id,number);const t=Core.totals(state);$('#progress-label').textContent=`已翻 ${t.opened}/50 · 已判 ${t.done}/50`;$('#progress').value=t.done;$('#result').innerHTML=`<span class="green">✔ ${t.good}</span><span class="red">✘ ${t.bad}</span>`;save();};
$('.tabs').onclick=e=>{const b=e.target.closest('[data-group]');if(b)group(Number(b.dataset.group));};
$('.tabs').onkeydown=e=>{if(!state)return;let i=state.group;if(e.key==='ArrowRight')i=(i+1)%5;else if(e.key==='ArrowLeft')i=(i+4)%5;else if(e.key==='Home')i=0;else if(e.key==='End')i=4;else return;e.preventDefault();group(i);$('#tab-'+i)?.focus();};
$('#previous').onclick=()=>group(state.group-1);$('#next').onclick=()=>group(state.group+1);
$('#refresh').onclick=()=>start(crypto.randomUUID(),true);
$('#repeat').onclick=()=>{if(!guard())return;state={...state,launchId:crypto.randomUUID(),round:state.round+1,group:0,opened:{},votes:{}};launchId=state.launchId;render();save();};
$('#import').onclick=()=>$('#import-file').click();$('#import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const raw=await f.text(),s=TextbookCore.restore(raw,bank);if(!s)throw new Error('请选择课本导出的主进度 JSON');imported=s;start(crypto.randomUUID(),true);notice(localStorage.getItem(Core.MAIN_KEY)?'已保存导入副本；当前仍优先使用本浏览器课本主进度。':'已读取主进度副本，课本记录未被改动。');}catch(err){notice('无法导入：'+err.message);}e.target.value='';};
$('#export').onclick=()=>{if(!guard())return;const url=URL.createObjectURL(new Blob([JSON.stringify({state,importedMain:imported},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='edito-b1-daily-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
window.addEventListener('storage',e=>{if(e.key===Core.MAIN_KEY)start(crypto.randomUUID(),true);});
window.addEventListener('focus',()=>{if(launchId)guard();});
setInterval(()=>{if(launchId)guard();},60000);
globalThis.DailyUI=Object.freeze({start,notice});render();
__DAILY_START__
})();
</script>__DAILY_BRIDGE__</body></html>
