<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>法语词汇检测 · Édito B1</title>
  <style>
    :root{color-scheme:light;--bg:#fff;--ink:#202124;--muted:#777b80;--line:#eeeef0;--pale:#f5f6f7;--green:#139950;--red:#ce454b;--disabled:#bfc3c6;--disabled-border:#e8eaec;font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{cursor:default}button:focus-visible{outline:2px solid #438ac7;outline-offset:3px}button,section{touch-action:manipulation}.app{max-width:700px;margin:0 auto;padding:18px 20px 16px}h1{font-size:22px;line-height:1.3;margin:0 0 5px;font-weight:750;letter-spacing:-.35px}.source{font-size:12px;color:var(--muted);margin:0}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:15px}.round{font-size:14px;font-weight:700}.badge{font-size:11px;font-weight:600;background:#eaf2fa;color:#427cae;padding:3px 8px;border-radius:20px}.summary{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:6px 0 7px}.result{color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}.result .green{color:var(--green)}.result .red{color:var(--red);margin-left:9px}progress{display:block;width:100%;height:3px;border:0;border-radius:5px;overflow:hidden;appearance:none}progress::-webkit-progress-bar{background:var(--line)}progress::-webkit-progress-value{background:var(--ink)}progress::-moz-progress-bar{background:var(--ink)}.tabs{display:flex;gap:5px;margin:12px 0 0}.tab{flex:1;border:1px solid var(--disabled-border);color:var(--muted);background:var(--bg);padding:5px 0;border-radius:20px;font-size:12px}.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}.list{margin-top:5px}.entry{padding:11px 0 10px;border-bottom:1px solid var(--line)}.word{border:0;display:block;width:100%;background:transparent;color:var(--ink);padding:0;text-align:left;font-size:20px;line-height:1.38;overflow-wrap:anywhere}.number,.french{font-weight:750}.ipa{font-weight:400;font-size:11px;color:var(--muted);margin-left:7px;vertical-align:baseline}.hidden-answer{visibility:hidden;pointer-events:none}.bottomline{display:flex;align-items:flex-start;gap:11px;margin-top:5px}.marks{flex:none;display:flex;gap:5px;padding-top:1px}.mark{min-width:38px;min-height:25px;border:1px solid currentColor;border-radius:7px;background:transparent;padding:2px 6px;display:inline-flex;justify-content:center;align-items:center;gap:3px;line-height:17px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}.mark.good{color:var(--green)}.mark.bad{color:var(--red)}.mark.good.selected{background:var(--green);border-color:var(--green);color:#fff}.mark.bad.selected{background:var(--red);border-color:var(--red);color:#fff}.entry.closed .mark,.mark:disabled:not(.selected){color:var(--disabled);border-color:var(--disabled-border);background:transparent}.entry.open.rated .mark.good:not(.selected){color:var(--green);border-color:var(--green)}.entry.open.rated .mark.bad:not(.selected){color:var(--red);border-color:var(--red)}.count{min-width:9px;text-align:center}.translation{margin:0;font-size:18px;line-height:1.5;overflow-wrap:anywhere;flex:1;min-width:0}.pager{display:flex;align-items:center;justify-content:space-between;margin-top:13px;font-size:12px;color:var(--muted)}.nav{border:1px solid var(--disabled-border);border-radius:20px;color:var(--ink);background:var(--bg);font-size:12px;padding:6px 13px}.nav.next{background:var(--ink);color:var(--bg);border-color:var(--ink)}.nav:disabled{opacity:.35}.actions{display:flex;gap:7px;margin-top:12px}.action{flex:1;border:1px solid var(--disabled-border);background:var(--bg);color:var(--ink);border-radius:8px;font-size:12px;padding:8px 4px}.action.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}.hint{font-size:11px;line-height:1.6;color:var(--muted);margin:10px 0 0}.storage-note{margin-top:5px;font-size:11px;color:var(--muted)}.storage-note.warning{color:var(--red)}.toast{min-height:17px;margin:5px 0 0;font-size:11px;color:var(--muted)}
    .part-heading{display:flex;align-items:baseline;gap:8px;margin:7px 0 0;padding:6px 8px;background:var(--pale);border-radius:6px;font-size:13px;font-weight:650;line-height:1.4}.part-label{flex:none;font-size:10.5px;font-weight:600;color:var(--muted)}.part-name{min-width:0;overflow-wrap:anywhere}
    @media(max-width:480px){.app{padding:14px 12px 12px}.word{font-size:19px}.translation{font-size:17px}.entry{padding:10px 0 9px}.bottomline{gap:9px}h1{font-size:21px}}
    @media(prefers-reduced-motion:no-preference){.mark{transition:background-color .1s,color .1s}.tab{transition:background-color .1s}}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#191b1e;--ink:#f0f0f1;--muted:#a0a3a7;--line:#303338;--pale:#26292e;--green:#39be78;--red:#ed747a;--disabled:#666b72;--disabled-border:#373b42}.badge{background:#263c51;color:#acd0f3}.mark.good.selected{background:#198851;border-color:#198851}.mark.bad.selected{background:#be4148;border-color:#be4148}}
  </style>
</head>
<body>
  <main class="app">
    <h1>法语词汇检测</h1>
    <p class="source">Édito B1 · U1 P1＋P2 · 法语 → 中文</p>
    <div class="topline"><span class="round" id="round-label"></span><span class="badge">5 组 · 50 词</span></div>
    <div class="summary"><span id="progress-label"></span><span class="result" id="result" aria-label="本轮结果"></span></div>
    <progress id="progress" max="50" value="0" aria-label="本轮检测进度"></progress>
    <nav class="tabs" role="tablist" aria-label="词汇分组"></nav>
    <section class="list" id="word-list" role="tabpanel" aria-label="本组词汇"></section>
    <div class="pager"><button class="nav" id="previous">← 上一组</button><span id="page-number"></span><button class="nav next" id="next">下一组 →</button></div>
    <div class="actions"><button class="action" id="repeat">再测本轮</button><button class="action primary" id="new-round">下一轮词汇</button></div>
    <p class="hint">点单词翻开／收起。✔／✘ 可改选；每轮每词只计一个结果。再测保留累计。</p>
    <p class="storage-note" id="storage-note">测试记录保存在此浏览器。</p><button class="nav" id="retry-sync" hidden>重试保存</button>
    <p class="hint">词汇、中文及音标沿用所提供词库；部分音标标注为待校对。</p>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
  </main>
  <script id="vocabulary-data" type="application/json">__VOCABULARY_JSON__</script>
  <script>__CORE_JS__</script>
  <script>__SYNC_JS__</script>
  <script>__HOST_BRIDGE__</script>
  <script>
  (() => {
    'use strict';
    const bank = JSON.parse(document.querySelector('#vocabulary-data').textContent);
    const dictionary = new Map(bank.map(entry => [entry.id, entry]));
    const Core = globalThis.VocabCore;
    const host = globalThis.VocabHost;
    const KEY = 'french-vocabulary-test:edito-b1-u1:v1';
    let state, memoryOnly = false, pending = 0, ready = !host, remoteRevision = -1, syncError = "", sync;
    const rowCache = new Map();
    if (!host) try { state = Core.restore(localStorage.getItem(KEY), bank); } catch { memoryOnly = true; }
    state ||= Core.create(bank);
    const $ = selector => document.querySelector(selector);
    const html = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    let toastTimer;
    function toast(message) { $('#toast').textContent = message; clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('#toast').textContent = ''; }, 3500); }
    function save() {
      if (host) {
        const note = $('#storage-note');
        note.classList.toggle('warning', !!syncError);
        note.textContent = !ready ? '正在读取检测记录…' : syncError ? '尚未保存，点击重试。' : pending ? '正在保存检测记录…' : '检测记录已保存。';
        $('#retry-sync').hidden = !syncError;
        return;
      }
      try { localStorage.setItem(KEY, JSON.stringify(state)); memoryOnly = false; }
      catch { memoryOnly = true; }
      const note = $('#storage-note');
      note.classList.toggle('warning', memoryOnly);
      note.textContent = memoryOnly ? '此环境不能保存记录；关闭页面后累计会丢失。' : '测试记录保存在此浏览器。';
    }
    function renderSummary() {
      const t = Core.totals(state);
      $('#round-label').textContent = `第 ${state.round} 轮`;
      $('#progress-label').textContent = `已翻 ${t.opened}/50 · 已判 ${t.done}/50`;
      $('#result').innerHTML = `<span class="green">✔ ${t.good}</span><span class="red">✘ ${t.bad}</span>`;
      $('#progress').value = t.done;
      $('#page-number').textContent = `${state.group + 1} / 5`;
      $('#previous').disabled = state.group === 0;
      $('#next').disabled = state.group === 4;
    }
    function renderRow(id, number) {
      const entry = dictionary.get(id), open = !!state.opened[id], rated = !!state.votes[id], counts = state.stats[id] || {good:0,bad:0};
      const visible = state.showCounts[id];
      return `<article class="entry ${open ? 'open' : 'closed'} ${rated ? 'rated' : ''}" data-id="${html(id)}">
        <button class="word" aria-label="${html(number + '. ' + entry.fr)}" aria-expanded="${open}" aria-controls="answer-${html(id)}"><span class="number">${number}.</span> <span class="french" lang="fr">${html(entry.fr)}</span><span class="ipa ${open ? '' : 'hidden-answer'}" aria-hidden="${!open}">${html(entry.ipa)}</span></button>
        <div class="bottomline"><div class="marks">${['good','bad'].map(kind => `<button class="mark ${kind} ${open && state.votes[id] === kind ? 'selected' : ''}" data-vote="${kind}" ${!open ? 'disabled' : ''} aria-label="${kind === 'good' ? '正确' : '错误'}${visible ? '，累计 ' + counts[kind] + ' 次' : ''}" aria-pressed="${state.votes[id] === kind}" title="${!open ? '先点击单词翻开答案' : state.votes[id] === kind ? '已选择' : (rated ? '改为' : '') + (kind === 'good' ? '正确' : '错误')}"><span aria-hidden="true">${kind === 'good' ? '✔' : '✘'}</span><span class="count ${visible ? '' : 'hidden-answer'}" aria-hidden="${!visible}">${counts[kind]}</span></button>`).join('')}</div><p class="translation ${open ? '' : 'hidden-answer'}" id="answer-${html(id)}" aria-hidden="${!open}">${html(entry.zh)}</p></div>
      </article>`;
    }
    function renderGroup(ids) {
      let lastPart;
      return ids.map((id,i) => {
        const entry = dictionary.get(id);
        const unit = entry.unite || entry.id.match(/^U(\d+)P/)?.[1];
        const part = [unit,entry.partie,entry.partie_title].join('|');
        let heading = '';
        if (part !== lastPart) {
          const label = `${unit ? 'U' + Number(unit) + ' · ' : ''}P${entry.partie}`;
          heading = `<h2 class="part-heading"><span class="part-label">${html(label)}</span><span class="part-name" lang="fr">${html(entry.partie_title || '')}</span></h2>`;
          lastPart = part;
        }
        const row = renderRow(id,i+1); rowCache.set(id,row);
        return heading + row;
      }).join('');
    }
    function render(persist = true) {
      if (!$('.tabs').children.length) $('.tabs').innerHTML = Array.from({length:5}, (_, i) => `<button class="tab" id="tab-${i}" role="tab" aria-controls="word-list" data-group="${i}">第 ${i + 1} 组</button>`).join('');
      for (const tab of $('.tabs').children) {
        const selected = Number(tab.dataset.group) === state.group;
        tab.setAttribute('aria-selected', String(selected)); tab.tabIndex = selected ? 0 : -1; tab.disabled = !ready;
      }
      $('#word-list').setAttribute('aria-labelledby', `tab-${state.group}`);
      const ids = state.ids.slice(state.group * 10, state.group * 10 + 10);
      const rows = Array.from($('#word-list').children).filter(row => row.classList.contains('entry'));
      const oldIds = rows.map(row => row.dataset.id);
      const active = document.activeElement;
      const activeId = active?.closest('.entry')?.dataset.id;
      const activeVote = active?.dataset.vote;
      if (oldIds.join('|') !== ids.join('|')) {
        rowCache.clear(); $('#word-list').innerHTML = renderGroup(ids);
      } else ids.forEach((id,i) => {
        const value = renderRow(id,i+1);
        if (value !== rowCache.get(id)) { rows[i].outerHTML = value; rowCache.set(id,value); }
      });
      renderSummary();
      $('#previous').disabled = !ready || state.group === 0; $('#next').disabled = !ready || state.group === 4;
      $('#repeat').disabled = $('#new-round').disabled = !ready;
      if (host && !ready) { $('#word-list').textContent = '正在读取你的检测记录…'; $('#round-label').textContent = '正在连接'; }
      if (activeId && !active.isConnected) {
        const row = Array.from($('#word-list').children).find(row => row.dataset.id === activeId);
        const target = activeVote ? row?.querySelector(`[data-vote="${activeVote}"]`) : row?.querySelector('.word');
        (target?.disabled ? row?.querySelector('.word') : target)?.focus({preventScroll:true});
      }
      if (persist) save();
    }
    function cloudAction(action, args = {}) {
      if (!host || !ready) return;
      if (sync.dispatch(action,args) && action === 'repeat') toast('已开始再测，累计已保留。');
    }
    $('#word-list').addEventListener('click', event => {
      const button = event.target.closest('button'), row = button?.closest('.entry');
      if (!button || !row) return;
      const id = row.dataset.id;
      if (host) {
        if (button.classList.contains('word')) cloudAction('toggle',{id});
        else if (button.dataset.vote) cloudAction('vote',{id,kind:button.dataset.vote});
        return;
      }
      if (button.classList.contains('word')) Core.toggle(state,id);
      else if (button.dataset.vote) {
        if (!Core.vote(state,id,button.dataset.vote)) return;
        toast(Core.totals(state).done === 50 ? '本轮 50 词已完成。' : '已记录');
      } else return;
      const index = state.ids.indexOf(id) % 10;
      const value=renderRow(id,index+1);row.outerHTML=value;rowCache.set(id,value);renderSummary();save();
      $(`[data-id="${id}"] .word`).focus({preventScroll:true});
    });
    function changeGroup(group, keyboard = false) {
      if (!Number.isInteger(group) || group < 0 || group >= 5) return;
      if (host) { cloudAction('group',{group}); if(keyboard) $(`[data-group="${group}"]`).focus(); return; }
      state.group = group; render();
      if (keyboard) $(`[data-group="${group}"]`).focus();
    }
    $('.tabs').addEventListener('click', event => { const tab=event.target.closest('[data-group]'); if(tab) changeGroup(Number(tab.dataset.group)); });
    $('.tabs').addEventListener('keydown', event => {
      const tab = event.target.closest('[data-group]'); if(!tab) return;
      let group=Number(tab.dataset.group);
      if(event.key==='ArrowRight') group=(group+1)%5; else if(event.key==='ArrowLeft') group=(group+4)%5; else if(event.key==='Home') group=0; else if(event.key==='End') group=4; else return;
      event.preventDefault(); changeGroup(group,true);
    });
    $('#previous').addEventListener('click', () => changeGroup(state.group-1));
    $('#next').addEventListener('click', () => changeGroup(state.group+1));
    $('#repeat').addEventListener('click', () => { if(host){cloudAction('repeat');return;} state=Core.restart(state,bank); render(); toast('已开始再测，累计次数已保留。'); });
    $('#new-round').addEventListener('click', () => { if(host){cloudAction('next');return;} state=Core.restart(state,bank,true); render(); toast('已从两个部分轮换抽取 50 词。'); });
    window.addEventListener('storage', event => {
      if(host || event.key!==KEY || !event.newValue) return;
      const updated=Core.restore(event.newValue,bank); if(updated){state=updated;render(false);}
    });
    render();
    if (host) {
      let storage; try { storage = localStorage; } catch {}
      sync = globalThis.VocabSync.create({core:Core,bank,host,storage,
        onChange(snapshot) { state=snapshot.state;remoteRevision=snapshot.revision;pending=snapshot.pending;syncError=snapshot.error;ready=true;render(); },
        onError:message=>toast(message)});
      $('#retry-sync').addEventListener('click',()=>sync.retry());
      host.start(snapshot=>sync.receive(snapshot),message=>toast(message));
      window.addEventListener('beforeunload',event=>{if(sync.pending){event.preventDefault();event.returnValue='';}});
    }

  })();
  </script>
</body>
</html>
