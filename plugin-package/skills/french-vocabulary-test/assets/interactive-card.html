      } else return;
      const index = state.ids.indexOf(id) % 10;
      const value=renderRow(id,index+1);row.outerHTML=value;rowCache.set(id,value);renderSummary();save();
      $(`[data-id="${id}"] .word`).focus({preventScroll:true});
    });
    function changeGroup(group, keyboard = false) {
      if (!Number.isInteger(group) || group < 0 || group >= 5) return;
      if (host) { cloudAction('group',{group}); if(keyboard) $(`[data-group="${group}"]`).focus(); return; }
      state.group = group; render();
      if (keyboard) $(`[data-group="${group}"]`).focus();
    }
    $('.tabs').addEventListener('click', event => { const tab=event.target.closest('[data-group]'); if(tab) changeGroup(Number(tab.dataset.group)); });
    $('.tabs').addEventListener('keydown', event => {
      const tab = event.target.closest('[data-group]'); if(!tab) return;
      let group=Number(tab.dataset.group);
      if(event.key==='ArrowRight') group=(group+1)%5; else if(event.key==='ArrowLeft') group=(group+4)%5; else if(event.key==='Home') group=0; else if(event.key==='End') group=4; else return;
      event.preventDefault(); changeGroup(group,true);
    });
    $('#previous').addEventListener('click', () => changeGroup(state.group-1));
    $('#next').addEventListener('click', () => changeGroup(state.group+1));
    $('#repeat').addEventListener('click', () => { if(host){cloudAction('repeat');return;} state=Core.restart(state,bank); render(); toast('已开始再测，累计次数已保留。'); });
    $('#new-round').addEventListener('click', () => { if(host){cloudAction('next');return;} state=Core.restart(state,bank,true); render(); toast('已从两个部分轮换抽取 50 词。'); });
    window.addEventListener('storage', event => {
      if(host || event.key!==KEY || !event.newValue) return;
      const updated=Core.restore(event.newValue,bank); if(updated){state=updated;render(false);}
    });
    render();
    if (host) {
      let storage; try { storage = localStorage; } catch {}
      sync = globalThis.VocabSync.create({core:Core,bank,host,storage,
        onChange(snapshot) { state=snapshot.state;remoteRevision=snapshot.revision;pending=snapshot.pending;syncError=snapshot.error;ready=true;render(); },
        onError:message=>toast(message)});
      $('#retry-sync').addEventListener('click',()=>sync.retry());
      host.start(snapshot=>sync.receive(snapshot),message=>toast(message));
      window.addEventListener('beforeunload',event=>{if(sync.pending){event.preventDefault();event.returnValue='';}});
    }

  })();
  </script>

</div>
